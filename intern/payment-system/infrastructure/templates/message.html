<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Payment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            max-width: 70vw;
            padding: 32px;
        }
        
        .text {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <p class="text">
            {{ .Message }}
        </p>
    </div>
</body>
</html>
