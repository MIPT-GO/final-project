<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Payment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .payment-container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 32px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
        }
        
        .store-message {
            background-color: #f8f9fa;
            border-left: 4px solid #4CAF50;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            color: #333;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .payment-details {
            margin-bottom: 32px;
        }
        
        .amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eaeaea;
        }
        
        .amount-label {
            color: #666;
            font-size: 16px;
        }
        
        .amount-value {
            font-size: 32px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .pay-button {
            width: 100%;
            padding: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .pay-button:hover {
            background-color: #45a049;
        }
        
        .pay-button:active {
            transform: translateY(1px);
        }
        
        .pay-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="logo">Оплата</div>
        
        <div class="store-message" id="storeMessage">
            {{ .Message }}
        </div>
        
        <div class="payment-details">
            <div class="amount">
                <div class="amount-label">К оплате:</div>
                <div class="amount-value">
                    {{ .Amount }}
                </div>
            </div>
        </div>
        
        <button class="pay-button" id="payButton">Оплатить</button>
    </div>

    <script>
        const payButton = document.getElementById('payButton');    
        payButton.addEventListener('click', async () => { 
            payButton.disabled = true;
            payButton.textContent = 'Оплата...';

            response = await fetch('{{ .Prefix }}/confirm/{{ .Key }}', {
                method: "POST"
            });

            if (response.status != 200) {
                payButton.disabled = false;
                payButton.textContent = "Оплатить"
                alert("Произошла ошибка при отправке платежа")
                return
            }

            payButton.textContent = "Успешно оплачено"
        });
    </script>
</body>
</html>
